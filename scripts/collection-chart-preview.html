<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>实时 K 线验证</title></head><body style="margin:0"><div id="root" style="height:100vh"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import '/src/app/globals.css';import {enableCollectionMode,loadCollectionConfig,collectionKeyAction} from '/src/lib/collection-config.ts';
enableCollectionMode();await loadCollectionConfig();
const [{KlineChart},{useAppStore},{useMarketStore},{getCollectionStream},{collectionDesktopSymbols}]=await Promise.all([import('/src/components/market/kline-chart.tsx'),import('/src/stores/app.ts'),import('/src/stores/market.ts'),import('/src/lib/collection-stream.ts'),import('/src/lib/collection-api.ts')]);
const requests=[];const original=window.fetch.bind(window);window.fetch=async(input,options)=>{if(String(input).includes('/api/tickets')&&options?.body){const {operation,symbol,resolution,count}=JSON.parse(options.body);requests.push({operation,symbol,resolution,count,at:Date.now()})}return original(input,options)};
let frames=0;const stream=getCollectionStream();stream.onMessage(m=>{if(m.type==='chart_kline')frames++});
window.chartQA={requests,frames:()=>frames,select:s=>useAppStore.getState().setActiveContract(s),snapshot:()=>{const s=useMarketStore.getState();return {bars:s.klineBars,realtime:s.klineRealtime,loading:s.klineLoading,state:stream.state}},start:async key=>{await collectionKeyAction('save',key);const symbols=await collectionDesktopSymbols();stream.onMessage(m=>{if(m.type==='quote')useMarketStore.getState().updateQuotes(m.data)});stream.setQuoteSymbols(symbols.map(s=>s.symbol.replace('-USDT-SWAP','usdt').toLowerCase()));useAppStore.getState().setActiveContract('btcusdt');stream.connect();createRoot(document.getElementById('root')).render(React.createElement(KlineChart,{userTradeLines:'off'}));return symbols.length}};
</script></body></html>
