class FixtureSocket{
 static OPEN=1;readyState=0;pending=new Map();interval=null;
 constructor(url){this.url=String(url);setTimeout(()=>{this.readyState=1;this.onopen?.({});const kind=ticketKinds.get(new URL(this.url,location.href).searchParams.get('ticket'));if(kind?.operation==='stream_quotes'){const emit=()=>this.frame({kind:'quote_update_not_trade',symbol:'BTC-USDT-SWAP',payload:{records:[],ticks:[],quote:{price:105,timestamp:Date.now()/1000,bid:104.9,ask:105.1,reference_price:100,change_percent:5,high_24h:110,low_24h:99,base_volume_24h:1234}}});emit();this.interval=setInterval(emit,1000)}if(kind?.operation==='okx_private_ws')this.frame({kind:'proxy_ready',account_verified:false})},30)}

  if(frame.token){this.frame({type:'ready'});return}

  }
  if(frame.type==='exchange_result'){
   const call=this.pending.get(frame.id);if(!call)return;this.pending.delete(frame.id);
   if(frame.data.code!=='0'){this.frame({type:'result',id:call.id,status:400,data:{detail:frame.data.msg}});return}
   const data=call.path.includes('daily-pnl')?{days:[{date:day,pnl:10,net:10,fee:1,fee_cost:1,funding:0,net_after_costs:9,win_pnl:10,loss_pnl:0,cumulative:10,trades:1}],summary:{total_profit:10,total_loss:0,profit_ratio:null,net:10,trade_days:1,total_trades:1}}:call.path.includes('positions')?{positions:[{symbol:'btcusdt',symbol_name:'BTC 永续',direction:'long',quantity:1,avg_price:100,mark_price:105,margin:100,unrealized_pnl:5,leverage:10}]}:call.path.includes('orders')?{orders:[{id:'o1',symbol:'btcusdt',direction:'sell',offset:'close',order_type:'market',quantity:1,filled_qty:1,status:'filled',avg_price:105,realized_pnl:10,fee:1,created_at:now,filled_at:now}]}:{equity:25000,available:24900,unrealized_pnl:5,currency:'USDT',venue:'okx',venue_name:'OKX',demo:true};
   this.frame({type:'result',id:call.id,status:200,data});
  }
 }
}
