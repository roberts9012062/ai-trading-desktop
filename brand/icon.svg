<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C33"/>
      <stop offset="0.55" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#070D1B"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D92445"/>
      <stop offset="1" stop-color="#FF6A4D"/>
    </linearGradient>
    <linearGradient id="up2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E5304E"/>
      <stop offset="1" stop-color="#FF7E55"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F0B429"/>
      <stop offset="1" stop-color="#FFDF7E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.32" cy="0.78" r="0.75">
      <stop offset="0" stop-color="#E5304E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E5304E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGold" cx="0.82" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#F0B429" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F0B429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#halo)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#haloGold)"/>
  <rect x="14" y="14" width="996" height="996" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4"/>

  <!-- K线:绿(回踩)→红(启动)→红(主升),阶梯上行 -->
  <!-- 阴线(绿) -->
  <line x1="302" y1="508" x2="302" y2="770" stroke="#2EA36E" stroke-width="18" stroke-linecap="round"/>
  <rect x="252" y="572" width="100" height="146" rx="20" fill="#2EA36E"/>
  <!-- 阳线1(红) -->
  <line x1="478" y1="392" x2="478" y2="668" stroke="url(#up)" stroke-width="18" stroke-linecap="round"/>
  <rect x="428" y="446" width="100" height="172" rx="20" fill="url(#up)"/>
  <!-- 阳线2(红,主升) -->
  <line x1="654" y1="228" x2="654" y2="548" stroke="url(#up2)" stroke-width="18" stroke-linecap="round"/>
  <rect x="604" y="276" width="100" height="212" rx="20" fill="url(#up2)"/>

  <!-- 金色上升趋势线 + 箭头 -->
  <path d="M 208 764 L 396 596 L 566 452 L 726 306" fill="none" stroke="url(#gold)"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 700 260 L 806 254 L 776 356 Z" fill="url(#gold)"/>
</svg>
