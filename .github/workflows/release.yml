name: release

# 打 tag(v*)→ 自动构建签名安装包 → 创建公开 GitHub Release
# 产物:ai-trading-desktop_x.y.z_x64-setup.exe + .sig + latest.json
# 更新分发:secret gist 永久清单 + 公开 Release 资产，客户端支持免费代理池。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify official OKX archive validation and repair
        run: pnpm exec vitest run src/lib/okx-history.test.ts src/lib/okx-history-backup.test.ts src/lib/okx-history-source.test.ts src/lib/okx-archive-repair.test.ts src/lib/okx-local-history.integration.test.ts src/lib/snippet-rest.test.ts src/lib/snippet-pool.test.ts

      - name: Verify rescued super-factor member display and persistence
        run: pnpm exec vitest run src/components/factor-lab/portfolio-card.test.ts src/lib/portfolio-favorite.test.ts src/components/factor-lab/hooks/factor-helpers.test.ts src/lib/mining/backends/native-gpu-core.test.ts src/lib/mining/native-runner-integration.test.ts src/lib/mining/research-grade.test.ts src/lib/mining/combo-super.test.ts src/lib/factor-access.test.ts src/lib/shortline/search-profile.test.ts src/lib/mining/gpu/feature-token-roundtrip.test.ts src/lib/mining/economic-seeds.test.ts

      - name: Verify factor evolution boundaries and recipe persistence
        run: pnpm exec vitest run src/lib/factor-evolution.test.ts src/lib/factor-evolution-runner.test.ts src/lib/factor-evolution-samples.test.ts src/lib/factor-task-review.test.ts src/components/factor-lab/evolution/task-factor-review.test.tsx src/components/factor-lab/evolution/evolution-page.test.ts src/components/factor-lab/evolution/evolution-progress.test.tsx src/components/factor-lab/evolution/evolution-research-report.test.tsx src/lib/binance-local-history.test.ts

      - name: Verify AI settings model selection for super-factor LLM seeds
        run: pnpm exec vitest run src/lib/llm-factor-seed.test.ts src/lib/mining/paper-factors.test.ts

      - name: Verify paper research entry points and CPU propagation
        run: pnpm exec vitest run src/lib/mining/seed-compatibility-protocol.test.ts src/lib/mining/backends/cpu-backend.test.ts src/components/factor-lab/paper-research-settings.test.tsx src/components/super-factor/paper-research-config.test.ts src/lib/mining/native-factor-lab-integration.test.ts

      - name: Verify paused task residual position display
        run: |
          pnpm exec vitest run src/components/ai-trading/task-close-button.test.ts src/components/ai-trading/equity/equity-chart.test.ts src/components/ai-trading/equity/equity-wave-data.test.ts src/lib/hunter/task-visibility.test.ts
          node --test src/components/ai-trading/equity/equity-data.test.mjs

      - name: Verify multi-factor collaboration and research feature selection
        run: pnpm exec vitest run src/lib/multi-factor.test.ts src/lib/factor-similarity-api.test.ts src/lib/mining/feature-selection.test.ts src/lib/favorite-filters.test.ts src/lib/quant-strategy-icons.test.ts src/lib/strategy-transfer.test.ts

      - name: Verify real-money authorization and targeted notices
        run: pnpm exec vitest run src/lib/live-permission.test.ts src/lib/announcements.test.ts src/lib/live-api-history.test.ts

      # 原生 GPU 引擎运行时组装(设计 §6):python-build-standalone CPython 3.11
      # + 按 requirements-native.lock 哈希校验安装的冻结依赖 + engine 包。
      # assemble 脚本内置打包解释器导入自检与 MANIFEST.sha256 生成。
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Assemble native engine runtime
        shell: bash
        run: |
          uv python install 3.11.14
          uv venv .local-data/native-engine-venv --python 3.11.14
          uv pip install --python .local-data/native-engine-venv/Scripts/python.exe \
            --require-hashes -r requirements-native.lock
          .local-data/native-engine-venv/Scripts/python.exe scripts/test-quant-kernel.py
          .local-data/native-engine-venv/Scripts/python.exe scripts/test-factor-backtest.py
          .local-data/native-engine-venv/Scripts/python.exe scripts/test-realtime-factor.py
          .local-data/native-engine-venv/Scripts/python.exe -m unittest tests.native_engine.test_factor_quality_features tests.native_engine.test_factor_semantics -v
          .local-data/native-engine-venv/Scripts/python.exe -m unittest tests.native_engine.test_economic_templates -v
          .local-data/native-engine-venv/Scripts/python.exe -m unittest tests.native_engine.test_dsr_calendar.DsrCpuCalendarTests -v
          .local-data/native-engine-venv/Scripts/python.exe -m unittest discover -s tests/native_engine -p test_wf.py -k FoldSize -v
          .local-data/native-engine-venv/Scripts/python.exe -m unittest discover -s tests/native_engine -p test_shortline_contract.py -k ShortlineCpu -v
          BASE_PREFIX="$(.local-data/native-engine-venv/Scripts/python.exe -c 'import sys; print(sys.base_prefix)')"
          .local-data/native-engine-venv/Scripts/python.exe scripts/assemble-native-engine.py \
            --python "$BASE_PREFIX" --venv .local-data/native-engine-venv
          test -f resources/native-engine/python/python.exe
          test -f resources/native-engine/VERSION
          test -f resources/native-engine/MANIFEST.sha256

      - name: Verify native analytics, seconds HTTP and export files
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib okx_analytics
          cargo test --manifest-path src-tauri/Cargo.toml --lib realtime_http
          cargo test --manifest-path src-tauri/Cargo.toml --lib export_file

      - name: Build signed bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # 更新说明经环境变量传入:提交信息里的引号/换行若直接内插进
          # run 命令会截断 shell 脚本(v0.1.33 首次构建即因此 127)
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: node scripts/make-update.mjs "$RELEASE_NOTES"

      - name: Create release (exe + sig)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --notes "$(cat update-dist/release-notes.txt)" \
            update-dist/ai-trading-desktop_*_x64-setup.exe \
            update-dist/ai-trading-desktop_*_x64-setup.exe.sig

      - name: Finalize latest.json and gist manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(cat update-dist/release-notes.txt)"
          node scripts/gh-release-finalize.mjs "$TAG" "$NOTES" "$VERSION"
