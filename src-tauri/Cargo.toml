[package]
name = "ai-trading-desktop"
version = "0.1.0"
description = "AI Trading Desktop桌面客户端"
authors = ["roberts9012062"]
edition = "2021"

[lib]
name = "ai_trading_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", features = [] }
tauri-plugin-process = { version = "2", features = [] }
tauri-plugin-log = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
